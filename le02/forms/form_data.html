<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>How Form Data Is Sent</title>
</head>
<body>
<form action="mailto:john.doe@johndoe.com" method="post" enctype="text/plain">
    <p>
        <label for="author">Name:</label>
        <input type="text" name="author" id="author">
    </p>
    <p>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email">
    </p>
    <button type="submit">Send</button>
</form>
</body>
</html>
