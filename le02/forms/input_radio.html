<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Radio Buttons</title>
</head>
<body>
<form action="mailto:john.doe@johndoe.com" method="post" enctype="text/plain">
    <fieldset>
        <legend>Favorite course:</legend>
        <p>
            <input type="radio" name="favorite" value="WEF1" id="wef" checked>
            <label for="wef">Web Fundamentals</label>
        </p>
        <p>
            <input type="radio" name="favorite" value="MCO1" id="mco">
            <label for="mco">Modern Code</label>
        </p>
        <p>
            <input type="radio" name="favorite" value="GEC1" id="gec">
            <label for="gec">Game Engine Concepts</label>
        </p>
    </fieldset>
    <button type="submit">Send</button>
</form>
</body>
</html>
