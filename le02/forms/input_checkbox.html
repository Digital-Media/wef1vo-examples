<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkboxes</title>
</head>
<body>
<form action="mailto:john.doe@johndoe.com" method="post" enctype="text/plain">
    <fieldset>
        <legend>Courses attended:</legend>
        <p>
            <input type="checkbox" name="courses" value="WEF1" id="wef1" checked>
            <label for="wef1">Web Fundamentals</label>
        </p>
        <p>
            <input type="checkbox" name="courses" value="MCO1" id="mco1">
            <label for="mco1">Modern Code</label>
        </p>
        <p>
            <input type="checkbox" name="courses" value="GEC1" id="gec1">
            <label for="gec1">Game Engine Concepts</label>
        </p>
    </fieldset>
    <button type="submit">Send</button>
</form>
</body>
</html>
