<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grouping with Fieldsets</title>
</head>
<body>
<form action="mailto:john.doe@johndoe.com" method="post" enctype="text/plain">
    <fieldset>
        <legend>Personal data</legend>
        <p>
            <label for="name">Name:</label>
            <input type="text" name="name" id="name">
        </p>
        <p>
            <label for="contact">Email:</label>
            <input type="email" name="contact" id="contact">
        </p>
    </fieldset>
    <button type="submit">Send</button>
</form>
</body>
</html>
