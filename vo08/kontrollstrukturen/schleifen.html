<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Schleifen</title>
</head>
<body>
<p>DevTools öffnen (F12) und auf den "Console"-Tab wechseln, um die Ausgabe des Beispiels zu sehen.</p>
<script>
    "use strict";

    let count = 0;

    console.log("--- while-Schleife ---");
    while (count < 10) {
        console.log(count);
        count++;
    }

    console.log("--- for-Schleife ---");
    for (let count = 0; count < 10; count++) {
        console.log(count);
    }
</script>
</body>
</html>
