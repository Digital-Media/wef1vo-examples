<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Loses Typkonzept</title>
</head>
<body>
<p>DevTools öffnen (F12) und auf den "Console"-Tab wechseln, um die Ausgabe des Beispiels zu sehen.</p>
<script>
    "use strict";

    let x = 42;
    console.log("x (als Ganzzahl):", x);

    x = "fourtytwo";
    console.log("x (jetzt als String):", x);
</script>
</body>
</html>
