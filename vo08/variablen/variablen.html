<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Variablen: Deklaration und Zuweisung</title>
</head>
<body>
<p>DevTools öffnen (F12) und auf den "Console"-Tab wechseln, um die Ausgabe des Beispiels zu sehen.</p>
<script>
    // Explizite Deklaration:
    let i;
    let summe, nachricht;

    // Deklaration mit var (vermeiden)
    var oldSchool;

    // Zuweisung:
    i = 0;
    summe = 3 + 5;
    nachricht = "Hallo Welt";
    oldSchool = "Besser nicht mehr...";

    // Deklaration & Zuweisung
    let j = 3;

    // Implizite Deklaration (vermeiden)
    k = 5;

    // Ausgabe in der DevTools-Console
    console.log("i:", i);
    console.log("summe:", summe);
    console.log("nachricht:", nachricht);
    console.log("oldSchool:", oldSchool);
    console.log("j:", j);
    console.log("k:", k);
</script>
</body>
</html>
