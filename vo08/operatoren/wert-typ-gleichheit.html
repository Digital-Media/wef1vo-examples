<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Vergleich auf Wert bzw. Wert und Typ</title>
</head>
<body>
<script>
    "use strict";

    const zahl = 1;
    const zahlAlsString = "1";

    // Überprüfung auf Wertegleichheit
    if (zahl == zahlAlsString) {
        console.log("--- zahl == zahlAlsString: if ---")
        console.log("Wert gleich (durch automatische Typumwandlung).");
    }

    // Überprüfung auf Werte- und Typgleichheit
    if (zahl === zahlAlsString) {
        console.log("--- zahl === zahlAlsString: if ---")
        console.log("Wert und Typ gleich."); // not gonna happen
    } else {
        console.log("--- zahl === zahlAlsString: else ---")
        console.log("Wert gleich, Typ aber unterschiedlich (Zahl vs. String).");
    }
</script>
</body>
</html>
