<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Scope &ndash; Mit var kein Block Scope, dafür Function Scope</title>
</head>
<body>
<p>DevTools öffnen (F12) und auf den "Console"-Tab wechseln, um die Ausgabe des Beispiels zu sehen.</p>
<script>
    "use strict";

    var scope = "global";

    function f() {
        var enterBlock = true;
        console.log(scope); // undefined
        if (enterBlock) {
            var scope = "local";
        }
        console.log(scope); // local
    }

    f();
</script>
</body>
</html>
