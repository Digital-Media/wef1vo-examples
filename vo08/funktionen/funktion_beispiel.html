<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Funktionen &ndash; Primzahl-Test</title>
</head>
<body>
<p>DevTools öffnen (F12) und auf den "Console"-Tab wechseln, um die Ausgabe des Beispiels zu sehen.</p>
<script>
    "use strict";

    function isPrime(number) {
        let isPrimeNumber = true;
        let i = 2;
        while (i * i <= number && isPrimeNumber) {
            if (number % i === 0) {
                isPrimeNumber = false;
            }
            i++;
        }
        return isPrimeNumber;
    }

    const x = 3;
    console.log("%d ist %s Primzahl", x, isPrime(x) ? "eine" : "keine");
</script>
</body>
</html>
