<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Scope &ndash; global vs. local</title>
</head>
<body>
<p>DevTools öffnen (F12) und auf den "Console"-Tab wechseln, um die Ausgabe des Beispiels zu sehen.</p>
<script>
    "use strict";

    let scope = "global";

    function f() {
        let scope = "local";
        console.log(scope);
    }

    f(); // local
    console.log(scope); // global
</script>
</body>
</html>
