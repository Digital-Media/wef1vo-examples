<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Scope &ndash; Block Scope mit let</title>
</head>
<body>
<p>DevTools öffnen (F12) und auf den "Console"-Tab wechseln, um die Ausgabe des Beispiels zu sehen.</p>
<script>
    "use strict";

    let scope = "global";

    function f() {
        let enterBlock = true;
        console.log(scope); // global
        if (enterBlock) {
            let scope = "local";
            console.log(scope); // local
        }
        console.log(scope);// global
    }

    f();
</script>
</body>
</html>
