<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Type Selectors</title>
    <style>
        body {
            background-color: #00FFFF;
        }

        h1 {
            color: #0000FF;
        }

        p {
            color: #FFFFFF;
            background-color: #808080;
        }

        em {
            font-family: "Courier New", Courier, monospace;
            font-size: 24px;
        }
    </style>
</head>
<body>
<h1>This is the heading</h1>
<p>This is a paragraph and <em>this part</em> is emphasized.</p>
</body>
</html>
