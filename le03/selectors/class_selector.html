<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Class Selectors</title>
    <style>
        .big {
            font-size: xx-large;
            font-family: Arial, Helvetica, sans-serif;
        }

        p.crazy {
            color: #FF00FF;
            background-color: #00FF00;
        }
    </style>
</head>
<body>
<p class="big">Paragraph 1 looks like this.</p>
<p class="crazy">Paragraph 2 a bit different.</p>
<p>But <span class="big">this part</span> looks like 1 again.</p>
</body>
</html>
