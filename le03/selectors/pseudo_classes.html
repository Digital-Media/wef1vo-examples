<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pseudo-Classes</title>
    <style>
        a:link {
            color: #FF0000;
            font-size: large;
        }

        li:nth-child(2n) {
            color: green;
        }

        section p:nth-of-type(2) {
            background-color: lightgray;
        }
    </style>
</head>
<body>
<p>The <a href="https://www.fh-ooe.at/en/">University of Applied Sciences Upper Austria</a> on the web.</p>
<ol>
    <li>A list item.</li>
    <li>Another one.</li>
    <li>And one more.</li>
    <li>And a fourth one.</li>
</ol>
<section>
    <p>A paragraph.</p>
    <div>A generic area.</div>
    <p>Another paragraph.</p>
</section>
</body>
</html>
