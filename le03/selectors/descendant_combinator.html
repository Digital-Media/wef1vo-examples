<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Descendant Combinators</title>
    <style>
        div em {
            color: #FF0000;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
<div>
    <p>This is text that is formatted <strong><em>here</em></strong>.</p>
</div>
<p>But not <em>here</em>.</p>
</body>
</html>
