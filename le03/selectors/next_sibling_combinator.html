<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Next-Sibling Combinators</title>
    <style>
        h1 + p {
            color: #FF0000;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
<h1>Here is the heading</h1>
<p>Here is the first, formatted paragraph.</p>
<p>Here is the second, unformatted one.</p>
</body>
</html>
