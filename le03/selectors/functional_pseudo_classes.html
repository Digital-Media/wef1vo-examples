<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Functional Pseudo-Classes</title>
    <style>
        :is(h1, h2) {
            color: purple;
        }

        p:not(:first-child) {
            color: blue;
        }

        article:has(p) {
            background-color: lightgray;
        }
    </style>
</head>
<body>
<h1>Heading</h1>

<article>
    <h2>Article heading</h2>
</article>

<article>
    <h2>Article heading</h2>
    <section>
        <p>Some text before</p>
        <h3>Section heading</h3>
        <p>Some text after</p>
    </section>
</article>
</body>
</html>
