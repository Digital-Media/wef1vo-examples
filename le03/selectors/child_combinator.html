<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Child Combinators</title>
    <style>
        p > em {
            color: #FF0000;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
<div>
    <p>This is text that is <strong><em>not</em></strong> formatted.</p>
</div>
<p>But <em>this</em> is.</p>
</body>
</html>
