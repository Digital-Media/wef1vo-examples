<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subsequent-Sibling Combinators</title>
    <style>
        div ~ p {
            color: #FF0000;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
<div>
    <p>First paragraph.</p>
</div>
<p>Second paragraph.</p>
<p>Third paragraph.</p>
</body>
</html>
