<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attribute Selectors</title>
    <style>
        a[href^="https://"] {
            color: #FF0000;
        }
    </style>
</head>
<body>
<h1>The heading</h1>
<p>Some text with a <a href="https://www.fh-ooe.at/">link to a website</a>.</p>
<p>More text with an <a href="mailto:john.doe@johndoe.com">email link</a>.</p>
</body>
</html>
