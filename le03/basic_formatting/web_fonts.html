<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web Fonts</title>
    <style>
        @font-face {
            font-family: "Noto Sans";
            src: url("noto-sans-v42-latin-regular.woff2") format("woff2");
            font-style: normal;
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: "Noto Sans";
            src: url("noto-sans-v42-latin-italic.woff2") format("woff2");
            font-style: italic;
            font-weight: 400;
            font-display: swap;
        }

        body {
            font-family: "Noto Sans", system-ui, sans-serif;
        }
    </style>
</head>
<body>
<h1>Heading</h1>
<p>A paragraph in Noto Sans with an <em>emphasized part</em> in the italic style.</p>
<p>Another paragraph.</p>
</body>
</html>
