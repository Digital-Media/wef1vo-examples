<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Element: Eigenschaften und Methoden</title>
    <style>
        .blue {
            color: blue;
        }

        .underline {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<p>DevTools öffnen (F12) und auf den "Console"-Tab wechseln, um die Ausgabe des Beispiels zu sehen.</p>
<script>
    "use strict";

    const heading = document.createElement("h1");
    heading.textContent = "Überschrift";

    heading.setAttribute("id", "important");
    console.log("ID gesetzt:", heading.id); // Ausgabe: "important"

    heading.id = "normal";
    console.log("ID geändert:", heading.getAttribute("id")); // Ausgabe: "normal"

    heading.className = "blue";
    console.log("Klasse gesetzt:", heading.className);

    heading.classList.add("underline");
    console.log("Klassenliste:", heading.classList); // DOMTokenList ["blue", "underline"]

    document.body.appendChild(heading);
    console.log("Element in den Body eingehängt:", heading);
</script>
</body>
</html>
