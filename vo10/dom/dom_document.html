<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Document: Eigenschaften und Methoden</title>
    <style>
        .red {
            color: red;
        }

        .underline {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div id="content">
    <p class="red underline">Red and Underlined</p>
</div>
<p>DevTools öffnen (F12) und auf den "Console"-Tab wechseln, um die Ausgabe des Beispiels zu sehen.</p>
<script>
    "use strict";

    const content = document.getElementById("content");
    console.log("Gefundenes Element (ID):", content);

    const bodyList = document.getElementsByTagName("body");
    const body = bodyList[0];
    console.log("Gefundenes Body-Element:", body);

    const redUnder = document.getElementsByClassName("red underline");
    console.log("Anzahl Elemente mit Klassen:", redUnder.length);

    const pInDiv = document.querySelector("div p");
    console.log("QuerySelector Ergebnis:", pInDiv);

    // Erstellen
    const newDiv = document.createElement("div");
    console.log("Neu erstelltes DIV:", newDiv); // Zeigt <div></div> (noch leer)

    const text = document.createTextNode("Hallo Welt!");
    console.log("Text-Knoten:", text);

    const idAttr = document.createAttribute("id");
    console.log("Attribut-Knoten:", idAttr);
</script>
</body>
</html>
