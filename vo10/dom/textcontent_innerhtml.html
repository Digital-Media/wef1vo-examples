<!DOCTYPE html>
<html lang="de">
<head>
    <title>Eigenschaft: textContent vs. innerHTML</title>
    <meta charset="utf-8">
</head>
<body>
<div>
    <h1 id="title">Überschrift</h1>
    <p>Hallo</p>
</div>
<script>
    "use strict";

    const container = document.querySelector("div");

    const pText = document.createElement("p");
    pText.textContent = `textContent: ${container.textContent}`;

    const pHtml = document.createElement("p");
    pHtml.innerHTML = `innerHTML: ${container.innerHTML}`;

    document.body.append(pText, pHtml);
</script>
</body>
</html>
