<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Margin collapse</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
        }

        #one {
            margin-bottom: 16px;
            margin-top: 16px;
            background-color: orange;
        }

        #two {
            margin-bottom: 50px;
            margin-top: 50px;
            background-color: green;
        }
    </style>
</head>
<body>
<p id="one">Paragraph 1</p>
<p id="two">Paragraph 2</p>
</body>
</html>
