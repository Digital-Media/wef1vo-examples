<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>position: relative</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
        }

        div {
            border: 1px solid black;
            width: 250px;
            height: 100px;
            margin: 10px;
        }

        #one {
            background-color: orange;
        }

        #two {
            position: relative;
            left: 80px;
            top: 30px;
            background-color: green;
        }

        #three {
            background-color: yellow;
        }
    </style>
</head>
<body>
<div id="one">First &lt;div&gt; element (static)</div>
<div id="two">Second &lt;div&gt; element (relative)</div>
<div id="three">Third &lt;div&gt; element (static)</div>
</body>
</html>
