<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flexbox: pushing an item with an auto margin</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            padding-inline: 1rem;
            background-color: rgb(250 94 94);
        }

        header a {
            color: white;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
        }

        /* Takes up all the free space and pushes the navigation to the right */
        nav {
            margin-inline-start: auto;
        }

        nav ul {
            display: flex;
            gap: 1.25rem;
            padding: 0;
            list-style-type: none;
        }
    </style>
</head>
<body>
<header>
    <a href="flex_auto_margin.html" class="logo">Jane Doe</a>
    <nav>
        <ul>
            <li><a href="#about">About</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
</header>
</body>
</html>
