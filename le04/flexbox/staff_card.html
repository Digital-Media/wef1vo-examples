<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flexbox: staff card</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
        }

        .staff-card {
            display: flex;
            gap: 1rem;
            max-width: 32rem;
            height: 12.5rem;
            padding: 1rem;
            border: 1px solid black;
        }

        .staff-photo img {
            height: 100%;
        }
    </style>
</head>
<body>
<section class="staff-card">
    <div class="staff-photo">
        <!-- Image generated by https://thispersondoesnotexist.com/ -->
        <img src="jane-doe.webp" alt="Photo of Jane Doe">
    </div>
    <div class="staff-details">
        <h2>Jane Doe</h2>
        <p>Senior Developer</p>
        <p><a href="mailto:jane.doe@company.com">jane.doe@company.com</a></p>
    </div>
</section>
</body>
</html>
