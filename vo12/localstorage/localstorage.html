<!DOCTYPE html>
<html lang="de">
<head>
    <title>Local Storage</title>
    <style>
        #sticky {
            background-color: rgb(251 244 172);
            width: 200px;
            height: 200px;
            padding: 20px;
        }
    </style>
    <meta charset="utf-8">
</head>
<body>
<section id="sticky" contenteditable="true"></section>

<script>
    const defaultText = "Schreib auf mich!";
    const note = document.getElementById("sticky");
    const storedValue = localStorage.getItem("content");

    if (storedValue) {
        note.innerHTML = storedValue;
    } else {
        note.innerHTML = defaultText;
    }

    note.addEventListener("blur", (event) => {
        const plainText = event.target.textContent;
        if (plainText.trim() === "" || plainText === defaultText) {
            localStorage.removeItem("content");
            event.target.innerHTML = defaultText;
        } else {
            localStorage.setItem("content", event.target.innerHTML);
        }
    });
</script>
</body>
</html>
