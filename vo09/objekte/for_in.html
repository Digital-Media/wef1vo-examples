<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>for...in-Schleife</title>
</head>
<body>
<p>DevTools öffnen (F12) und auf den "Console"-Tab wechseln, um die Ausgabe des Beispiels zu sehen.</p>
<script>
    "use strict";

    const student = {
        name: "John Doe",
        age: 22,
        program: "MTD",
        languages: ["Java", "C#"]
    };

    for (const property in student) {
        console.log("Eigenschaft:", property);
        console.log("Wert:", student[property]);
    }
</script>
</body>
</html>
