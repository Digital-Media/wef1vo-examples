<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Vordefinierte Objekte: String</title>
</head>
<body>
<p>DevTools öffnen (F12) und auf den "Console"-Tab wechseln, um die Ausgabe des Beispiels zu sehen.</p>
<script>
    "use strict";

    const text = "Das ist ein langer Text";

    // Zeichen an Position ausgeben
    console.log(text.charAt(4)); // i
    // Prüfen, ob "langer" enthalten ist (gibt true/false)
    console.log(text.includes("langer")); // true
    // Substring: Start (inkl.) bis Ende (exkl.)
    console.log(text.substring(4, 7)); // ist
    // Slice: Die letzten 4 Zeichen ausschneiden (Negativer Index)
    console.log(text.slice(-4)); // Text
    // String bei den Leerzeichen teilen
    console.log(text.split(" ")); // ["Das", "ist", "ein", "langer", "Text"]
    // Länge des Strings
    console.log(text.length); // 23
</script>
</body>
</html>
