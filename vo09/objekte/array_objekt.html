<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Vordefinierte Objekte: Array</title>
</head>
<body>
<p>DevTools öffnen (F12) und auf den "Console"-Tab wechseln, um die Ausgabe des Beispiels zu sehen.</p>
<script>
    "use strict";

    const grades = [1, 2, 3, 4, 5];

    // 1. Element hinzufügen
    grades.push(1);
    console.log(grades); // [1, 2, 3, 4, 5, 1]
    // 2. Filtern (nur positive Noten <= 4)
    // Die Arrow-Function übergibt jedes Element im Array und gibt nur die zurück, die <= 4 sind
    const passed = grades.filter(n => n <= 4);
    console.log(passed); // [1, 2, 3, 4, 1]
    // 3. Transformieren (Noten verdoppeln - Mapping)
    const doubled = passed.map(n => n * 2);
    console.log(doubled); // [2, 4, 6, 8, 2]
    // 4. Prüfen ob enthalten
    console.log(grades.includes(5)); // true
</script>
</body>
</html>
