<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Studierende*r mit Objekt-Literal-Syntax</title>
</head>
<body>
<p>DevTools öffnen (F12) und auf den "Console"-Tab wechseln, um die Ausgabe des Beispiels zu sehen.</p>
<script>
    "use strict";

    // Daten des*der Studenten*Studentin & Ausgabe bzw. Änderung der Daten
    const student = {
        name: "John Doe",
        age: 22,
        program: "MTD",
        languages: ["Java", "C#"],
        showLanguages() {
            console.log(`${this.name} (${this.age}, ${this.program}) beherrscht diese Sprachen: ${this.languages}`);
        },
        learnNewLanguage(language) {
            this.languages[this.languages.length] = language;
        }
    };

    // Aufrufe
    student.showLanguages(); // Java,C#
    student.learnNewLanguage("JavaScript");
    student.showLanguages(); // Java,C#,JavaScript
</script>
</body>
</html>
