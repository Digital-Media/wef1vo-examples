<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Vordefinierte Objekte: Date</title>
</head>
<body>
<p>DevTools öffnen (F12) und auf den "Console"-Tab wechseln, um die Ausgabe des Beispiels zu sehen.</p>
<script>
    "use strict";

    const d = new Date();

    // Komplettes Datum ausgeben (entspricht d.toString())
    console.log(d); // z.B. Fri Jan 09 2026 13:29:12 GMT+0100 (Central European Standard Time)
    // Jahr ausgeben
    console.log(d.getFullYear()); // z.B. 2026
    // Wochentag ausgeben
    console.log(d.getDay()); // z.B. 5 für Freitag
    // Stunde ausgeben
    console.log(d.getHours()); //z.B. 13
    // Minute ausgeben
    console.log(d.getMinutes()); // z.B. 29
    // Formatiert für Österreich ausgeben
    const options = { weekday: "long", year: "numeric", month: "long", day: "numeric" };
    console.log(d.toLocaleDateString("de-AT", options)); // z.B. Freitag, 9. Januar 2026
    // Unix-Timestamp
    console.log(Date.now()); // z.B. 1767961752219
</script>
</body>
</html>
