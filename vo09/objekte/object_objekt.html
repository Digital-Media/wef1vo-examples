<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Vordefinierte Objekte: Object</title>
</head>
<body>
<p>DevTools öffnen (F12) und auf den "Console"-Tab wechseln, um die Ausgabe des Beispiels zu sehen.</p>
<script>
    "use strict";

    const person = { name: "John", age: 22 };
    console.log(Object.keys(person)); // ["name", "age"]
    console.log(Object.values(person)); // ["John", 22]
    console.log(Object.entries(person)); // [["name", "John"], ["age", 22]]
</script>
</body>
</html>
